<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc">
  <title id="title">Kushal Gowda S current project tracker</title>
  <desc id="desc">A colorful terminal-inspired dashboard tracking WAS'NRT, 3rd Sem EL, Tide Terminal, HALO DSSB, and FFmpeg contributions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0d1628"/>
      <stop offset="1" stop-color="#12182c"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .name { font-size: 25px; font-weight: 700; fill: #f8fafc; letter-spacing: .3px; }
      .mode { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
      .body { font-size: 17px; fill: #cbd5e1; }
      .next { font-size: 15px; fill: #94a3b8; }
      .pipe { font-size: 14px; font-weight: 700; letter-spacing: .4px; }
      .ascii { font-size: 18px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1000" height="1040" rx="30" fill="url(#bg)"/>
  <path d="M30 118H970" stroke="#26334c" stroke-width="2"/>
  <circle cx="50" cy="45" r="8" fill="#fb7185"/>
  <circle cx="76" cy="45" r="8" fill="#fbbf24"/>
  <circle cx="102" cy="45" r="8" fill="#4ade80"/>
  <text x="50" y="82" class="mono" font-size="29" font-weight="800" fill="url(#titleGlow)">KUSHAL.GOWDA / PROJECT CONTROL</text>
  <text x="50" y="106" class="mono" font-size="14" fill="#94a3b8">systems :: machine learning :: developer tools :: open source</text>
  <rect x="779" y="48" width="171" height="36" rx="18" fill="#12243b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="803" cy="66" r="6" fill="#4ade80"/>
  <text x="820" y="71" class="mono" font-size="13" font-weight="700" fill="#bae6fd">5 ACTIVE TRACKS</text>

  <!-- WAS'NRT -->
  <g filter="url(#shadow)">
    <rect x="42" y="146" width="916" height="154" rx="20" fill="#111c31" stroke="#334155"/>
    <rect x="42" y="146" width="10" height="154" rx="5" fill="#a78bfa"/>
  </g>
  <rect x="72" y="170" width="144" height="28" rx="14" fill="#2e2150"/>
  <text x="144" y="189" class="mono mode" text-anchor="middle" fill="#d8b4fe">ACTIVE RESEARCH</text>
  <text x="72" y="231" class="mono name">WAS'NRT</text>
  <text x="72" y="260" class="mono body">Wasmtime + direct Vulkan GPU runtime</text>
  <text x="72" y="284" class="mono next">NEXT  matched Vulkan vs native WebGPU benchmark</text>
  <rect x="709" y="172" width="215" height="90" rx="16" fill="#191735" stroke="#6d5bd0"/>
  <text x="816" y="206" class="mono ascii" fill="#c4b5fd">[WASM]--&gt;{VK}</text>
  <text x="816" y="237" class="mono pipe" text-anchor="middle" fill="#a78bfa">CODE [x]  BENCH [~]</text>

  <!-- EL -->
  <g filter="url(#shadow)">
    <rect x="42" y="320" width="916" height="154" rx="20" fill="#111c31" stroke="#334155"/>
    <rect x="42" y="320" width="10" height="154" rx="5" fill="#22d3ee"/>
  </g>
  <rect x="72" y="344" width="105" height="28" rx="14" fill="#0b3b49"/>
  <text x="124" y="363" class="mono mode" text-anchor="middle" fill="#a5f3fc">TRAINING</text>
  <text x="72" y="405" class="mono name">3RD SEM EL</text>
  <text x="72" y="434" class="mono body">Code-clone retrieval and negative-sampling study</text>
  <text x="72" y="458" class="mono next">NEXT  record F1 + checkpoint; run BM25 and Semantic</text>
  <rect x="709" y="346" width="215" height="90" rx="16" fill="#0c2936" stroke="#0891b2"/>
  <text x="816" y="380" class="mono ascii" fill="#67e8f9">[DATA]=&gt;[MODEL]</text>
  <text x="816" y="411" class="mono pipe" text-anchor="middle" fill="#22d3ee">3,675 / 4,000</text>

  <!-- Tide -->
  <g filter="url(#shadow)">
    <rect x="42" y="494" width="916" height="154" rx="20" fill="#111c31" stroke="#334155"/>
    <rect x="42" y="494" width="10" height="154" rx="5" fill="#4ade80"/>
  </g>
  <rect x="72" y="518" width="168" height="28" rx="14" fill="#123a2b"/>
  <text x="156" y="537" class="mono mode" text-anchor="middle" fill="#bbf7d0">USABLE / ITERATING</text>
  <text x="72" y="579" class="mono name">TIDE TERMINAL</text>
  <text x="72" y="608" class="mono body">Terminal tabs, timers, output rules and input alerts</text>
  <text x="72" y="632" class="mono next">NEXT  release cleanup and a stable tag</text>
  <rect x="709" y="520" width="215" height="90" rx="16" fill="#102c25" stroke="#22c55e"/>
  <text x="816" y="554" class="mono ascii" fill="#86efac">$ tide --ship _</text>
  <text x="816" y="585" class="mono pipe" text-anchor="middle" fill="#4ade80">INSTALL [x]  TAG [ ]</text>

  <!-- Halo -->
  <g filter="url(#shadow)">
    <rect x="42" y="668" width="916" height="154" rx="20" fill="#111c31" stroke="#334155"/>
    <rect x="42" y="668" width="10" height="154" rx="5" fill="#fbbf24"/>
  </g>
  <rect x="72" y="692" width="121" height="28" rx="14" fill="#493317"/>
  <text x="132" y="711" class="mono mode" text-anchor="middle" fill="#fde68a">INTEGRATION</text>
  <text x="72" y="753" class="mono name">HALO: DSSB</text>
  <text x="72" y="782" class="mono body">Private Discord Activity + laptop host</text>
  <text x="72" y="806" class="mono next">NEXT  finish config and pass a local end-to-end test</text>
  <rect x="709" y="694" width="215" height="90" rx="16" fill="#332617" stroke="#d97706"/>
  <text x="816" y="728" class="mono ascii" fill="#fcd34d">o==[HOST]==o</text>
  <text x="816" y="759" class="mono pipe" text-anchor="middle" fill="#fbbf24">CONFIG [~]  TEST [ ]</text>

  <!-- FFmpeg -->
  <g filter="url(#shadow)">
    <rect x="42" y="842" width="916" height="154" rx="20" fill="#111c31" stroke="#334155"/>
    <rect x="42" y="842" width="10" height="154" rx="5" fill="#fb7185"/>
  </g>
  <rect x="72" y="866" width="201" height="28" rx="14" fill="#482333"/>
  <text x="172" y="885" class="mono mode" text-anchor="middle" fill="#fecdd3">MERGED + RESEARCH</text>
  <text x="72" y="927" class="mono name">FFMPEG CONTRIBUTIONS</text>
  <text x="72" y="956" class="mono body">libswscale optimization + portable SIMD experiments</text>
  <text x="72" y="980" class="mono next">NEXT  real cross-architecture hardware validation</text>
  <rect x="709" y="868" width="215" height="90" rx="16" fill="#351c2b" stroke="#e11d48"/>
  <text x="816" y="902" class="mono ascii" fill="#fda4af">YUV =&gt; [SWS] =&gt; Y</text>
  <text x="816" y="933" class="mono pipe" text-anchor="middle" fill="#fb7185">MERGED [x]  PORT [~]</text>
</svg>
